name: Build NuqootPro Release APK

on:
  workflow_dispatch:

jobs:
  build-apk:
    # استخدام إصدار 22.04 لتجنب إجبار Node 24
    runs-on: ubuntu-22.04
    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 4. Clean and Fix Imports
        run: |
          find . -name "*.js" -not -path "./node_modules/*" -exec sed -i "s|expo-file-system/legacy|expo-file-system|g" {} +
          find . -name "*.js" -not -path "./node_modules/*" -exec sed -i "s|FileSystemLegacy|FileSystem|g" {} +

      - name: 5. Install Dependencies
        run: |
          npm install --legacy-peer-deps

      - name: 6. Prebuild Android
        run: |
          mkdir -p assets
          # التأكد من وجود أيقونة لمنع فشل Gradle
          if [ ! -f assets/icon.png ]; then
            curl -o assets/icon.png https://raw.githubusercontent.com/expo/expo/main/templates/expo-template-blank/assets/icon.png
          fi
          npx expo prebuild --platform android --clean
        env:
          EXPO_NO_TELEMETRY: 1

      - name: 7. Configure Keystore
        run: |
          cd android/app
          rm -f debug.keystore
          keytool -genkeypair -v -keystore debug.keystore -alias androiddebugkey -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=NuqootPro,OU=App,O=Shark,L=Cairo,ST=Cairo,C=EG"
          sed -i 's/signingConfig signingConfigs.release/signingConfig signingConfigs.debug/g' build.gradle

      - name: 8. Create JS Bundle (Alternative Method)
        run: |
          mkdir -p android/app/src/main/assets
          # استخدام expo export:embed بدلاً من react-native bundle لأنها أكثر استقراراً في SDK 51
          npx expo export:embed \
            --platform android \
            --dev false \
            --dest android/app/src/main/res \
            --output android/app/src/main/assets/index.android.bundle
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"

      - name: 9. Build Release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon \
            -x bundleReleaseJsAndAssets \
            -x createBundleReleaseJsAndAssets
        env:
          CI: true
          _JAVA_OPTIONS: "-Xmx4096m"

      - name: 10. Upload Final APK
        uses: actions/upload-artifact@v4
        with:
          name: NuqootPro-V1.3.0
          path: android/app/build/outputs/apk/release/*.apk
