name: Build NuqootPro Release APK

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-22.04 # استخدام نسخة مستقرة لتجنب Node 24 الإجباري
    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20.18.0' # إصدار محدد جداً ومستقر

      - name: 4. Fix Imports & Clean Cache
        run: |
          # حذف أي استدعاءات قديمة قد تسبب فشل Metro
          find . -name "*.js" -not -path "./node_modules/*" -exec sed -i "s|expo-file-system/legacy|expo-file-system|g" {} +
          find . -name "*.js" -not -path "./node_modules/*" -exec sed -i "s|FileSystemLegacy|FileSystem|g" {} +
          rm -rf node_modules package-lock.json

      - name: 5. Install Dependencies
        run: |
          npm install --legacy-peer-deps

      - name: 6. Prebuild Android Project
        run: |
          # إنشاء مجلد الأيقونات إذا فقد لضمان عدم تعليق Gradle
          mkdir -p assets
          if [ ! -f assets/icon.png ]; then
            curl -o assets/icon.png https://raw.githubusercontent.com/expo/expo/main/templates/expo-template-blank/assets/icon.png
          fi
          npx expo prebuild --platform android --clean
        env:
          EXPO_NO_TELEMETRY: 1

      - name: 7. Configure Android Signing
        run: |
          cd android/app
          rm -f debug.keystore
          keytool -genkeypair -v -keystore debug.keystore -alias androiddebugkey -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=NuqootPro,OU=App,O=Shark,L=Cairo,ST=Cairo,C=EG"
          sed -i 's/signingConfig signingConfigs.release/signingConfig signingConfigs.debug/g' build.gradle

      - name: 8. Create JS Bundle (Safe Method)
        run: |
          mkdir -p android/app/src/main/assets
          # استخدام NODE_OPTIONS لتخطي تحذيرات Node الجديدة
          export NODE_OPTIONS="--no-warnings --max-old-space-size=4096"
          npx react-native bundle \
            --platform android \
            --dev false \
            --entry-file node_modules/expo/AppEntry.js \
            --bundle-output android/app/src/main/assets/index.android.bundle \
            --assets-dest android/app/src/main/res
        
      - name: 9. Assemble APK
        run: |
          cd android
          chmod +x gradlew
          # إجبار Gradle على البناء باستخدام الكود المجمع يدوياً وتجاهل أخطاء Node
          ./gradlew assembleRelease --no-daemon \
            -x bundleReleaseJsAndAssets \
            -x createBundleReleaseJsAndAssets
        env:
          CI: true
          _JAVA_OPTIONS: "-Xmx4096m"

      - name: 10. Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NuqootPro-V1.3.0-Success
          path: android/app/build/outputs/apk/release/*.apk
