name: Build NuqootPro Release APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 4. Clean and Install Dependencies
        run: |
          rm -rf node_modules package-lock.json
          npm install --legacy-peer-deps

      - name: 5. Generate Android Native Project
        run: npx expo prebuild --platform android --clean
        env:
          CI: true
          EXPO_NO_TELEMETRY: 1

      - name: 6. Fix Signing and Keystore
        run: |
          cd android/app
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -alias androiddebugkey \
            -storepass android \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=NuqootPro,OU=App,O=Shark,L=Cairo,ST=Cairo,C=EG"
          # إجبار أندرويد على استخدام المفتاح الدائم للبناء
          sed -i 's/signingConfig signingConfigs.release/signingConfig signingConfigs.debug/g' build.gradle || true

      - name: 7. Build Android Release APK via Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
        env:
          CI: true
          _JAVA_OPTIONS: "-Xmx4096m"

      - name: 8. Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NuqootPro-APK-Final
          path: android/app/build/outputs/apk/release/*.apk
