name: Build NuqootPro Release APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 4. Install Dependencies
        run: npm install --legacy-peer-deps

      - name: 5. Generate Android Project
        run: npx expo prebuild --platform android --clean
        env:
          CI: true

      - name: 6. Configure Keystore Signature for In-Place App Updates
        run: |
          cd android/app
          sed -i 's/signingConfig signingConfigs.release/signingConfig signingConfigs.debug/g' build.gradle || true

      - name: 7. Build Release APK with High Memory Allocation
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon -Dorg.gradle.jvmargs="-Xmx6144m -XX:MaxMetaspaceSize=1024m"

      - name: 8. Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NuqootPro-APK-Final
          path: android/app/build/outputs/apk/**/*.apk
