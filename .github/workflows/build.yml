name: Build NuqootPro Release APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 4. Auto-Fix Legacy Imports (Nuclear Fix)
        run: |
          echo "Fixing all legacy imports..."
          find . -name "*.js" -not -path "./node_modules/*" -exec sed -i "s|expo-file-system/legacy|expo-file-system|g" {} +
          find . -name "*.js" -not -path "./node_modules/*" -exec sed -i "s|FileSystemLegacy|FileSystem|g" {} +
          find . -name "*.js" -not -path "./node_modules/*" -exec sed -i "s|FileSystemStandard|FileSystem|g" {} +
          echo "Done."

      - name: 5. Install Dependencies
        run: |
          rm -rf node_modules package-lock.json
          npm install --legacy-peer-deps

      - name: 6. Generate Android Native Project
        run: npx expo prebuild --platform android --clean
        env:
          CI: true
          EXPO_NO_TELEMETRY: 1

      - name: 7. Configure Permanent Keystore
        run: |
          cd android/app
          rm -f debug.keystore release.keystore
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -alias androiddebugkey \
            -storepass android \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=NuqootPro,OU=App,O=Shark,L=Cairo,ST=Cairo,C=EG"
          sed -i 's/signingConfig signingConfigs.release/signingConfig signingConfigs.debug/g' build.gradle || true

      - name: 8. Manual JS Bundle (Shows Real Error)
        run: |
          mkdir -p android/app/src/main/assets
          npx react-native bundle \
            --platform android \
            --dev false \
            --entry-file node_modules/expo/AppEntry.js \
            --bundle-output android/app/src/main/assets/index.android.bundle \
            --assets-dest android/app/src/main/res \
            --verbose 2>&1 | tee bundle.log
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"

      - name: 9. Build Release APK (Skip JS Bundle)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon \
            -x bundleReleaseJsAndAssets \
            -x createBundleReleaseJsAndAssets
        env:
          CI: true
          _JAVA_OPTIONS: "-Xmx4096m"

      - name: 10. Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NuqootPro-APK-Final
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
