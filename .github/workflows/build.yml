name: Build NuqootPro Release APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 4. Install Dependencies
        run: npm install --legacy-peer-deps

      - name: 5. Generate Android Project
        run: npx expo prebuild --platform android --clean
        env:
          CI: true
          EXPO_NO_TELEMETRY: 1

      - name: 6. Configure Keystore Signature
        run: |
          cd android/app
          rm -f debug.keystore
          keytool -genkeypair -v -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -keystore debug.keystore -dname "CN=NuqootPro,OU=App,O=Shark,L=Cairo,ST=Cairo,C=EG"
          sed -i 's/signingConfig signingConfigs.release/signingConfig signingConfigs.debug/g' build.gradle || true

      - name: 7. Build Android Release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon -x test -x lint
        env:
          CI: true
          EXPO_NO_TELEMETRY: 1
          NODE_OPTIONS: "--max-old-space-size=8192"
          _JAVA_OPTIONS: "-Xmx8192m -XX:MaxMetaspaceSize=2048m"

      - name: 8. Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NuqootPro-APK-Final
          path: android/app/build/outputs/apk/release/*.apk
